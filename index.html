<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barktype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
	<header>
		<div class="logo">barktype</div>
		<a href="https://github.com/CodeAndCofe" target="_blank" rel="noopener">github</a>
	</header>

	<div class="config" id="config">
		<span>time</span>
		<button data-t="15">15</button>
		<button data-t="30">30</button>
		<button data-t="60">60</button>
		<button data-t="120">120</button>
		<input id="custom" type="number" min="5" max="600" placeholder="custom" aria-label="Custom time in seconds">
	</div>

	<section>
		<div id="clock">30</div>
		<div id="text"><p class="hint">Pick a time, then press Start. The text appears and the clock begins.</p></div>
		<div id="result">
			<div><small>wpm</small><b id="wpm">0</b></div>
			<div><small>accuracy</small><b id="acc">0%</b></div>
			<div><small>correct keys</small><b id="keys">0</b></div>
		</div>
	</section>

	<div class="actions">
		<button id="go">Start</button>
		<span class="keys">Tab or Esc to stop</span>
	</div>
</main>

<div class="mobile-note">Use a laptop with a keyboard to play.</div>
<script src="js/global.js"></script>
<script src="js/index.js"></script>
</body>
</html>
